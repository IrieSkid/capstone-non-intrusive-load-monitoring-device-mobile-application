<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - NILM Prototype</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .reset-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 60px);
            padding: 32px 24px;
        }
        
        .reset-icon {
            width: 80px;
            height: 80px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 24px;
            color: var(--primary);
        }
        
        .reset-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .reset-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            text-align: center;
            max-width: 280px;
        }
        
        .form-container {
            width: 100%;
            max-width: 320px;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="icon-btn" onclick="history.back()">←</button>
            </div>
            <h1>Reset Password</h1>
            <div class="header-right"></div>
        </div>
        
        <!-- Content -->
        <div class="content">
            <div class="reset-container">
                <div class="reset-icon">🔒</div>
                <div class="reset-title">Reset Password</div>
                <div class="reset-subtitle">
                    Enter your email to receive password reset instructions
                </div>
                
                <div class="form-container">
                    <div class="input-group">
                        <label class="input-label">Email Address</label>
                        <input type="email" class="input-field" placeholder="Enter your email">
                    </div>
                    
                    <a href="02-login.html" class="btn btn-primary" style="text-align: center; text-decoration: none;">
                        SEND RESET LINK
                    </a>
                    
                    <div class="signup-link" style="margin-top: 24px;">
                        Remember your password? <a href="02-login.html" class="link">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
