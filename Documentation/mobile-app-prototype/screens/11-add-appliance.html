<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Appliance - NILM Prototype</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .form-container {
            padding: 16px;
        }
        
        .appliance-type-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .appliance-type-card {
            background: var(--surface);
            border: 2px solid var(--divider);
            border-radius: 12px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .appliance-type-card:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        
        .appliance-type-card.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        
        .appliance-type-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .appliance-type-label {
            font-size: 12px;
            font-weight: 500;
        }
        
        .help-text {
            background: var(--background);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="icon-btn" onclick="history.back()">←</button>
            </div>
            <h1>Add Appliance</h1>
            <div class="header-right">
                <button class="icon-btn" style="color: white; font-size: 16px; font-weight: 600;">Save</button>
            </div>
        </div>
        
        <!-- Content -->
        <div class="content">
            <div class="form-container">
                <div class="card">
                    <div class="card-title" style="margin-bottom: 16px;">Appliance Information</div>
                    
                    <div class="input-group">
                        <label class="input-label">Appliance Name <span class="required">*</span></label>
                        <input type="text" class="input-field" placeholder="e.g., Refrigerator">
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Appliance Type <span class="required">*</span></label>
                        <div class="appliance-type-grid">
                            <div class="appliance-type-card selected">
                                <div class="appliance-type-icon">🧊</div>
                                <div class="appliance-type-label">Refrigerator</div>
                            </div>
                            <div class="appliance-type-card">
                                <div class="appliance-type-icon">❄️</div>
                                <div class="appliance-type-label">AC</div>
                            </div>
                            <div class="appliance-type-card">
                                <div class="appliance-type-icon">📺</div>
                                <div class="appliance-type-label">TV</div>
                            </div>
                            <div class="appliance-type-card">
                                <div class="appliance-type-icon">💡</div>
                                <div class="appliance-type-label">Light</div>
                            </div>
                            <div class="appliance-type-card">
                                <div class="appliance-type-icon">🌀</div>
                                <div class="appliance-type-label">Fan</div>
                            </div>
                            <div class="appliance-type-card">
                                <div class="appliance-type-icon">🔌</div>
                                <div class="appliance-type-label">Other</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Device <span class="required">*</span></label>
                        <select class="select-field">
                            <option>Main Meter</option>
                            <option>Unit 2 Meter</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Port Number <span class="required">*</span></label>
                        <input type="number" class="input-field" placeholder="e.g., 1" min="1" max="8">
                        <div class="help-text">
                            Select the port number on the device where this appliance is connected (1-8)
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Rated Power (Watts) <span class="required">*</span></label>
                        <input type="number" class="input-field" placeholder="e.g., 200" min="0">
                        <div class="help-text">
                            Enter the rated power consumption of the appliance in watts
                        </div>
                    </div>
                </div>
                
                <a href="09-appliances.html" class="btn btn-primary" style="text-align: center; text-decoration: none; margin-top: 16px;">
                    ADD APPLIANCE
                </a>
            </div>
        </div>
        
        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="05-dashboard.html" class="nav-item">
                <div class="nav-icon">🏠</div>
                <div>Dashboard</div>
            </a>
            <a href="06-devices.html" class="nav-item">
                <div class="nav-icon">📱</div>
                <div>Devices</div>
            </a>
            <a href="12-reports.html" class="nav-item">
                <div class="nav-icon">📊</div>
                <div>Reports</div>
            </a>
            <a href="13-notifications.html" class="nav-item">
                <div class="nav-icon">🔔</div>
                <div>Alerts</div>
            </a>
            <a href="16-profile.html" class="nav-item">
                <div class="nav-icon">👤</div>
                <div>Profile</div>
            </a>
        </div>
    </div>
</body>
</html>
