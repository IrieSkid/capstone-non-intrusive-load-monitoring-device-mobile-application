<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NILM Prototype</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 60px);
            padding: 32px 24px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: var(--primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 24px;
            color: white;
        }
        
        .login-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .login-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            text-align: center;
        }
        
        .form-container {
            width: 100%;
            max-width: 320px;
        }
        
        .input-with-icon {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 0;
        }
        
        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox input {
            width: 18px;
            height: 18px;
        }
        
        .link {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-secondary);
            font-size: 12px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--divider);
        }
        
        .divider span {
            padding: 0 16px;
        }
        
        .btn-google {
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--divider);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-google:hover {
            background: var(--background);
        }
        
        .signup-link {
            text-align: center;
            margin-top: 24px;
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="icon-btn" onclick="history.back()">←</button>
            </div>
            <h1>Login</h1>
            <div class="header-right">
                <a href="20-help.html" class="link" style="color: white; font-size: 12px;">Help?</a>
            </div>
        </div>
        
        <!-- Content -->
        <div class="content">
            <div class="login-container">
                <div class="logo">⚡</div>
                <div class="login-title">Welcome Back!</div>
                <div class="login-subtitle">Sign in to continue</div>
                
                <div class="form-container">
                    <div class="input-group">
                        <label class="input-label">Email Address</label>
                        <input type="email" class="input-field" placeholder="Enter your email" value="john@example.com">
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Password</label>
                        <div class="input-with-icon">
                            <input type="password" class="input-field" placeholder="Enter your password" value="••••••••">
                            <button class="input-icon">👁</button>
                        </div>
                    </div>
                    
                    <div class="checkbox-group">
                        <label class="checkbox">
                            <input type="checkbox" checked>
                            <span>Remember Me</span>
                        </label>
                        <a href="04-forgot-password.html" class="link">Forgot Password?</a>
                    </div>
                    
                    <a href="05-dashboard.html" class="btn btn-primary">SIGN IN</a>
                    
                    <div class="divider">
                        <span>OR</span>
                    </div>
                    
                    <a href="05-dashboard.html" class="btn btn-google">
                        <span>🔍</span>
                        <span>Continue with Google</span>
                    </a>
                    
                    <div class="signup-link">
                        Don't have an account? <a href="03-register.html" class="link">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
